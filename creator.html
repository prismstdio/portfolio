  <!-- CREATOR -->
  <section id="creator">
    <div class="section-head">
      <h2 class="creator-title split-title" id="creator-title" data-testid="creator-title">
        <span class="ln" data-word="/Creator"></span>
      </h2>
    </div>

    <p class="reel-intro">Derniers réels sous l'identité <a href="https://www.instagram.com/prism.stdio" target="_blank">@prism.stdio</a> — clique sur une vignette pour l'agrandir.</p>

    <!--
      Pour ajouter un reel, deux options sur la tuile "reel-tile" :

      1) Fichier vidéo fourni (rendu 100% propre, sans habillage Instagram) :
      <div class="reel-tile" data-video="assets/reels/nom-du-fichier.mp4" data-testid="reel-N">
        <img class="reel-cover" src="assets/reels/nom-du-fichier.jpg" alt="" />
        <div class="reel-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>

      2) Pas de fichier vidéo, juste le lien (YouTube ou Instagram) : la couverture
         se remplit toute seule si c'est un lien YouTube ; pour Instagram, il faut
         fournir une image de couverture toi-même (voir option 1).
      <div class="reel-tile" data-reel="https://www.instagram.com/reel/XXXX/ ou https://youtube.com/shorts/XXXX" data-testid="reel-N">
        <img class="reel-cover" src="assets/reels/nom-du-fichier.jpg" alt="" />
        <div class="reel-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
    -->
    <div class="reel-stack-wrap">
      <div class="reel-stack" id="reel-stack">
        <!-- Reel 1 — lien fourni, en attente de l'image de couverture / du fichier vidéo -->
        <div class="reel-tile placeholder" data-reel="https://youtube.com/shorts/Eeo89IEb6XI?feature=share" data-testid="reel-1">
          <div class="reel-ph-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <span>@prism.stdio<br>Voir sur Instagram</span>
        </div>
        <div class="reel-tile placeholder" data-reel="https://youtube.com/shorts/SQ_XSM4ujXE?feature=share" data-testid="reel-2">
          <div class="reel-ph-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <span>Reel à venir</span>
        </div>
        <div class="reel-tile placeholder" data-reel="https://youtube.com/shorts/PzCTwzZ-aig?feature=share" data-testid="reel-3">
          <div class="reel-ph-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <span>Reel à venir</span>
        </div>
        <div class="reel-tile placeholder" data-reel="https://youtube.com/shorts/rbQgre4NDaA?feature=share" data-testid="reel-4">
          <div class="reel-ph-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <span>Reel à venir</span>
        </div>
        <div class="reel-tile placeholder" data-reel="https://youtube.com/shorts/y_E-VDLsyMY?feature=share" data-testid="reel-5">
          <div class="reel-ph-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <span>Reel à venir</span>
        </div>
        <div class="reel-tile placeholder" data-reel="https://youtube.com/shorts/h_IJBU3srGI?feature=share" data-testid="reel-6"
          <div class="reel-ph-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <span>Reel à venir</span>
        </div>
      </div>

      <div class="reel-stack-nav">
        <button class="reel-nav-btn" id="reel-prev" aria-label="Reel précédent">‹</button>
        <div class="reel-stack-dots" id="reel-dots"></div>
        <button class="reel-nav-btn" id="reel-next" aria-label="Reel suivant">›</button>

  </section>
